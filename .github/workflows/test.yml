name: Test Formulae Update

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  test-formulae:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: RuboCop check
        run: bundle exec rubocop

      - name: Run update script
        run: bundle exec ruby update.rb

      # Informational only. These gems (nokogiri, rubocop, bundler-audit) are
      # build/test tooling and are never shipped to tap users, so a newly
      # published advisory ("advisory drift") must not block formula delivery.
      # Gems are kept patched automatically by Dependabot (.github/dependabot.yml)
      # and by `bundle update` in the Update Formulas workflow.
      - name: Run Bundler Audit (informational)
        continue-on-error: true
        run: |
          bundle exec bundler-audit check --update

      - name: Read update summary
        id: read_summary
        run: |
          echo "UPDATE_SUMMARY<<EOF" >> $GITHUB_ENV
          cat update_summary.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Verify update summary
        run: |
          if [ ! -s update_summary.txt ]; then
            echo "Update summary is empty"
            exit 1
          fi
          echo "Update summary is set"
