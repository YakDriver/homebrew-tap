name: Update Formulas

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Allows manual triggering of the workflow

permissions:
  contents: write
  pull-requests: write

jobs:
  update-formula:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Refresh Gemfile.lock to the latest allowed gem versions on every run so
      # the generated PR always carries current, patched dependencies. This lets
      # the daily PR self-heal advisory drift instead of shipping a stale lock.
      - name: Update bundled gems
        run: bundle update

      - name: Run update script
        run: |
          bundle exec ruby update.rb

      - name: Run tfproviderdocs update script
        run: |
          bundle exec ruby update_tfproviderdocs.rb

      - name: Read update summary
        id: read_summary
        run: |
          echo "UPDATE_SUMMARY<<EOF" >> $GITHUB_ENV
          cat update_summary.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PAT }}
          committer: yakdriverbot <f1formula.juan@gmail.com>
          author: yakdriverbot <f1formula.juan@gmail.com>
          commit-message: "Update formulas"
          base: main
          branch: update-formulas
          title: "Update formulas"
          body: |
            This PR updates the following formulas with the latest versions and sha256 hashes:

            ${{ env.UPDATE_SUMMARY }}
